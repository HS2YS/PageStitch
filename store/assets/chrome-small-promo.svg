<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" role="img" aria-labelledby="promo-title promo-desc">
  <title id="promo-title">PageStitch promotional tile</title>
  <desc id="promo-desc">A segmented webpage being stitched into one document by a cyan capture path.</desc>
  <defs>
    <linearGradient id="background" x1="20" y1="18" x2="422" y2="262" gradientUnits="userSpaceOnUse" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#392480"/>
      <stop offset=".31" stop-color="#5a3bd0"/>
      <stop offset=".62" stop-color="#744ff2"/>
      <stop offset=".84" stop-color="#5440c7"/>
      <stop offset="1" stop-color="#27336f"/>
    </linearGradient>
    <linearGradient id="page" x1="144" y1="35" x2="299" y2="246" gradientUnits="userSpaceOnUse" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#f8f7ff"/>
      <stop offset=".68" stop-color="#eeebff"/>
      <stop offset="1" stop-color="#dcd7ff"/>
    </linearGradient>
    <linearGradient id="cyan" x1="46" y1="54" x2="394" y2="231" gradientUnits="userSpaceOnUse" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#a4f5ff"/>
      <stop offset=".28" stop-color="#57e8ff"/>
      <stop offset=".58" stop-color="#28c8ea"/>
      <stop offset=".82" stop-color="#44e7d8"/>
      <stop offset="1" stop-color="#a3ffe8"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5" fx=".42" fy=".42" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#9cf5ff" stop-opacity=".72"/>
      <stop offset=".35" stop-color="#6be7ff" stop-opacity=".31"/>
      <stop offset=".72" stop-color="#7759ff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#392480" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="170%" color-interpolation-filters="linearRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset in="blur" dx="0" dy="13" result="offset"/>
      <feFlood flood-color="#171344" flood-opacity=".36" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-shadow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="linearRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offset"/>
      <feFlood flood-color="#1d174c" flood-opacity=".28" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="stitches" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 11H6" fill="none" stroke="#d8d2ff" stroke-width="1.4" stroke-linecap="round" opacity=".24"/>
    </pattern>
    <clipPath id="page-clip">
      <path d="M154 30h112l34 34v169a17 17 0 0 1-17 17H154a17 17 0 0 1-17-17V47a17 17 0 0 1 17-17Z"/>
    </clipPath>
  </defs>

  <g id="background">
    <rect width="440" height="280" fill="url(#background)"/>
    <rect width="440" height="280" fill="url(#stitches)"/>
    <ellipse cx="220" cy="142" rx="199" ry="156" fill="url(#glow)"/>
    <circle cx="30" cy="242" r="74" fill="#251d63" opacity=".22"/>
    <circle cx="417" cy="32" r="88" fill="#70e9ff" opacity=".08"/>
  </g>

  <g id="capture-corners" fill="none" stroke="url(#cyan)" stroke-width="4" stroke-linecap="round">
    <path d="M42 84V54a14 14 0 0 1 14-14h31" opacity=".82"/>
    <path d="M353 240h31a14 14 0 0 0 14-14v-30" opacity=".82"/>
  </g>

  <g id="document" filter="url(#shadow)">
    <path d="M154 30h112l34 34v169a17 17 0 0 1-17 17H154a17 17 0 0 1-17-17V47a17 17 0 0 1 17-17Z" fill="url(#page)"/>
    <path d="M266 30v25a9 9 0 0 0 9 9h25" fill="#cfc8ff"/>
    <path d="M266 30 300 64h-25a9 9 0 0 1-9-9Z" fill="#e4e0ff"/>

    <g clip-path="url(#page-clip)">
      <rect x="154" y="84" width="129" height="35" rx="7" fill="#e5e1ff"/>
      <rect x="154" y="124" width="129" height="42" rx="7" fill="#f1efff"/>
      <rect x="154" y="171" width="129" height="31" rx="7" fill="#e5e1ff"/>
      <rect x="154" y="207" width="129" height="24" rx="7" fill="#f1efff"/>

      <g fill="none" stroke-linecap="round">
        <path d="M169 96h75" stroke="#9e96da" stroke-width="5"/>
        <path d="M169 107h97" stroke="#c0bae9" stroke-width="4"/>
        <path d="M169 137h82" stroke="#aaa3df" stroke-width="5"/>
        <path d="M169 149h99" stroke="#c5c0eb" stroke-width="4"/>
        <path d="M169 183h68" stroke="#9e96da" stroke-width="5"/>
        <path d="M169 194h98" stroke="#c0bae9" stroke-width="4"/>
        <path d="M169 218h82" stroke="#aaa3df" stroke-width="5"/>
      </g>
    </g>
  </g>

  <g id="stitch-path" filter="url(#soft-shadow)">
    <path d="M76 111h50c12 0 13 11 25 11h138c15 0 16 14 31 14h42" fill="none" stroke="#24205d" stroke-opacity=".3" stroke-width="10" stroke-linecap="round"/>
    <path d="M76 107h50c12 0 13 11 25 11h138c15 0 16 14 31 14h42" fill="none" stroke="url(#cyan)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="97" cy="107" r="8" fill="#f8ffff" stroke="#5deaff" stroke-width="4"/>
    <circle cx="126" cy="107" r="7" fill="#3b2b8c" stroke="#7ff0ff" stroke-width="4"/>
    <circle cx="320" cy="132" r="7" fill="#3b2b8c" stroke="#6be9e4" stroke-width="4"/>
    <circle cx="348" cy="132" r="8" fill="#f8ffff" stroke="#75f2dc" stroke-width="4"/>
  </g>

  <g id="segment-tabs" filter="url(#soft-shadow)">
    <rect x="54" y="146" width="54" height="37" rx="9" fill="#ffffff" opacity=".96"/>
    <rect x="62" y="154" width="38" height="6" rx="3" fill="#9b90e5"/>
    <rect x="62" y="165" width="28" height="5" rx="2.5" fill="#d3cef3"/>
    <rect x="332" y="76" width="54" height="37" rx="9" fill="#ffffff" opacity=".96"/>
    <rect x="340" y="84" width="38" height="6" rx="3" fill="#8c82db"/>
    <rect x="340" y="95" width="28" height="5" rx="2.5" fill="#d3cef3"/>
  </g>
</svg>
