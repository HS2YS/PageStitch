<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="icon-title">
  <title id="icon-title">PageStitch page capture icon</title>
  <defs>
    <linearGradient id="background" x1="18" y1="14" x2="112" y2="116" gradientUnits="userSpaceOnUse" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset=".34" stop-color="#7357ed"/>
      <stop offset=".68" stop-color="#3b82d8"/>
      <stop offset="1" stop-color="#12b8c8"/>
    </linearGradient>
    <linearGradient id="paper" x1="46" y1="26" x2="82" y2="103" gradientUnits="userSpaceOnUse" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#f8f9ff"/>
      <stop offset=".78" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#dce6ff"/>
