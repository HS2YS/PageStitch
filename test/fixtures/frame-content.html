<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      * { box-sizing: border-box; }
      html { font-family: system-ui, sans-serif; }
      body { margin: 0; }
      header {
        position: sticky; top: 0; padding: 20px 32px;
        background: #171a23; color: white;
      }
      section {
        min-height: 620px; padding: 70px 9vw;
        border-bottom: 1px solid #e5e7ef;
      }
      section:nth-child(2n) { background: #f0edff; }
    </style>
  </head>
  <body>
    <header>Same-origin iframe fixture</header>
    <section><h1>Frame section 01</h1></section>
    <section><h1>Frame section 02</h1></section>
    <section><h1>Frame section 03</h1></section>
    <section><h1>Frame section 04</h1></section>
  </body>
</html>
